name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bundle Assets & Make 100% Offline
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # Web directory banayein
          mkdir -p www
          cp -f index.html www/index.html || cp -f Index.html www/index.html

          # 100% Offline assets download karke app me pack karna
          curl -sL https://cdn.tailwindcss.com -o www/tailwind.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js -o www/fontawesome.js
          curl -sL https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js -o www/confetti.js

          # index.html me offline scripts jodna
          sed -i 's|https://cdn.tailwindcss.com|tailwind.js|g' www/index.html
          sed -i 's|<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">|<script src="fontawesome.js"></script>|g' www/index.html
          sed -i 's|
