name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bundle Assets & Make 100% Offline
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Web folder setup
          mkdir -p www
          cp -f [iI]ndex.html www/index.html || cp -f index.html www/index.html

          # 100% Offline libraries download
          curl -sL https://cdn.tailwindcss.com -o www/tailwind.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js -o www/fontawesome.js
          curl -sL https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js -o www/confetti.js

          # Offline scripts link karna
          sed -i 's|https://cdn.tailwindcss.com|tailwind.js|g' www/index.html
          sed -i 's|<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">|<script src="fontawesome.js"></script>|g' www/index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js|confetti.js|g' www/index.html

          # Capacitor config
          node -e 'fs.writeFileSync("capacitor.config.json", JSON.stringify({appId: "com.studyflow.govtprep", appName: "GovtPrepFlow", webDir: "www"}))'

          # Android project setup
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: GovtStudyFlow-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
